apiVersion: apps/v1
kind: Deployment
metadata:
  name: glownest
  labels:
    app: glownest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glownest
  template:
    metadata:
      labels:
        app: glownest
    spec:
      containers:
      - name: glownest
        image: <dockerhub-username>/glownest:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
